name: StylePort Apple Build

on:
  push:
    branches: ["**"]
    # A v… release tag attaches the ad-hoc signed IPA to that release, next to the
    # command-line binaries; an ios-v… tag publishes it as an iOS-only pre-release. Path
    # filters don't apply to tag pushes.
    tags: ["v*", "ios-v*"]
    paths:
      - "swiftPort/**"
      - ".github/workflows/swift-port.yml"
  pull_request:
    paths:
      - "swiftPort/**"
      - ".github/workflows/swift-port.yml"
  workflow_dispatch:

jobs:
  apple-build:
    runs-on: macos-26
    permissions:
      contents: write
    defaults:
      run:
        working-directory: swiftPort
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run Swift package tests
        run: swift test
      - name: Build iOS and iPadOS simulator app
        run: >-
          xcodebuild -project StylePort.xcodeproj -scheme StylePort
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/StylePort-iOS-Simulator"
          CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS and iPadOS device app
        run: >-
          xcodebuild -project StylePort.xcodeproj -scheme StylePort
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/StylePort-iOS"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package app bundles
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/StylePort-artifacts"
          mkdir -p "$artifact_root/ios-simulator" "$artifact_root/ios-device"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/StylePort-iOS-Simulator/Build/Products/Debug-iphonesimulator/StylePort.app" \
            "$artifact_root/ios-simulator/Palettify-iOS-Simulator-unsigned.zip"
          # An ad-hoc signed ("fakesigned") IPA for sideloading tools and LiveContainer.
          # Ad-hoc signing needs no certificate or provisioning profile; installers
          # (SideStore, AltStore, Sideloadly, LiveContainer) replace the signature with
          # their own on install. A completely unsigned binary also installs in
          # LiveContainer, but the ad-hoc signature matches what every other
          # distributed IPA carries, so strict tools accept the file as-is.
          payload="$RUNNER_TEMP/ipa/Payload"
          mkdir -p "$payload"
          cp -R "$RUNNER_TEMP/StylePort-iOS/Build/Products/Release-iphoneos/StylePort.app" "$payload/"
          codesign --force --sign - "$payload/StylePort.app/Frameworks/StylePortCore.framework/StylePortCore"
          codesign --force --sign - "$payload/StylePort.app/StylePort"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$artifact_root/ios-device/Palettify.ipa" Payload)
          (cd "$artifact_root/ios-simulator" && shasum -a 256 *.zip > SHA256SUMS.txt)
          # Its own name: a release also carries the binaries' SHA256SUMS.txt.
          (cd "$artifact_root/ios-device" && shasum -a 256 *.ipa > Palettify-SHA256SUMS.txt)
      - name: Verify packaged app identity
        run: |
          app="$RUNNER_TEMP/StylePort-iOS/Build/Products/Release-iphoneos/StylePort.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = "0.7.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = "6"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Info.plist")" = "Palettify"
      - name: Upload unsigned iOS and iPadOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: Palettify-iOS-Simulator-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/StylePort-artifacts/ios-simulator
          if-no-files-found: error
          retention-days: 14
      - name: Upload ad-hoc signed iOS and iPadOS device IPA
        uses: actions/upload-artifact@v7
        with:
          name: Palettify-iOS-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/StylePort-artifacts/ios-device
          if-no-files-found: error
          retention-days: 14
      - name: Attach the IPA to the release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ios-v')
        working-directory: ${{ runner.temp }}/StylePort-artifacts/ios-device
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(Palettify.ipa Palettify-SHA256SUMS.txt)
          exists() { gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; }
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            # The binary release workflow creates this release, with its notes; wait for it
            # (up to 40 minutes) rather than race it.
            for _ in $(seq 80); do exists && break; sleep 30; done
          fi
          if exists; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --prerelease --title "Palettify $GITHUB_REF_NAME" \
              --notes "Ad-hoc signed iOS and iPadOS app for sideloading with SideStore, LiveContainer, Sideloadly or AltStore, which replace the signature with their own on install. Needs iOS 17 or later. Built from $GITHUB_SHA."
          fi
